<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Note Generator</title>
  <script src="https://cdnjs.middleware.io/browser/libs/0.0.2/middleware-rum.min.js" type="text/javascript" crossorigin="anonymous"></script>
  <script>
    if (window.Middleware){
      Middleware.track({
        serviceName:"musical-ear",
        projectName:"musical-ear",
        accountKey:"lxjziubyikaomcycmipkmhjlvqxindmezdaj",
        target: "https://sandbox.middleware.io",
        tracePropagationTargets: [/.*/],
        defaultAttributes: {
          "app.version": "1.0.0",
        },
      })
    }
  </script>
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "177d2c7f5c074081a1bc15acbeb4c18d"}'></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body onload="showNoteList()">

<h1>Music School</h1>

<div class="mode-selector">
  <button type="button" class="mode-button" data-mode="play" onclick="setMode('play')">Play mode</button>
  <button type="button" class="mode-button active" data-mode="test" onclick="setMode('test')">Ear Training</button>
  <div>
    <p id="mode-instruction">Tap the keys to hear them play or switch to test mode for guessing.</p>
    <p id="sound-status" class="sound-status">Loading sounds…</p>
  </div>
</div>

<div id="note-list"></div>

<div class="controls-row">
  <div class="steps-row">
    <div class="step-card">
      <span class="step-number">Step 1</span>
      <button id="play-random" class="play" onclick="playRandomNote()">Play a Random Note</button>
      <button id="play-again" class="play" onclick="playExistingSequence()" disabled>Hear Again</button>
      <p class="step-description">Play a random note to start the exercise.</p>
    </div>
    <div class="step-card">
      <span class="step-number">Step 2</span>
      <label for="guess-select">Guess the note</label>
      <select id="guess-select">
        <option value="">Select a note</option>
      </select>
      <p class="step-description">Choose which key you think just played.</p>
    </div>
    <div class="step-card">
      <span class="step-number">Step 3</span>
      <button class="check" onclick="checkAnswer()">Check Answer</button>
      <p class="step-description">Reveal the correct note.</p>
    </div>
    <p id="answer-display" class="answer-display"></p>
  </div>

  <div class="settings-panel">
    <h3>Settings</h3>
    <div class="reference-controls">
      <label class="reference-toggle">
        <input type="checkbox" id="reference-note-toggle" checked>
        Play reference note before pattern
      </label>
      <label for="reference-note-select">Reference note</label>
      <select id="reference-note-select"></select>
    </div>
    <label for="repeat-count">How many times should the note be played?</label>
    <input type="number" id="repeat-count" value="3" min="1">

    <label for="gap-among-notes">Gap between consecutive notes (seconds)?</label>
    <input type="number" id="gap-among-notes" value="2" min="0.1" step="0.1">
  </div>
</div>

<input type="hidden" id="note-answer">
<script src="audio.js"></script>
<script src="app.js"></script>

</body>
</html>
