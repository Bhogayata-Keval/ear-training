<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Note Generator</title>
  <style>
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 24px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    #note-list {
      margin-top: 12px;
    }

    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
      padding-bottom: 12px;
    }

    .key {
      border-radius: 6px;
      border: 1px solid #333;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
    }
    .octave {
      position: relative;
      margin-right: 12px;
    }

    .white-row {
      display: flex;
      gap: 4px;
    }

    .black-row {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 120px;
      pointer-events: none;
    }

    .black-row .key {
      position: absolute;
      bottom: 0;
      z-index: 2;
      pointer-events: auto;
    }

    .white-key {
      background: #fff;
      color: #111;
      width: 56px;
      height: 160px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    .black-key {
      background: #111;
      color: #fff;
      width: 36px;
      height: 120px;
    }

    .key.selected {
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.45);
    }

    .key:active {
      transform: translateY(2px);
    }

    .keyboard-controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .keyboard-controls button {
      border: none;
      background: #2f80ed;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .keyboard-controls button:hover {
      background: #2563eb;
    }

    .controls-row {
      margin-top: 24px;
    }

    .reference-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .reference-controls select,
    #guess-select {
      border-radius: 4px;
      border: 1px solid #ccc;
      padding: 4px 8px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
    }

    .reference-toggle {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #guess-select {
      width: 200px;
      margin-top: 6px;
    }

    .controls-row label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
    }

    .controls-row input[type="number"] {
      width: 90px;
      padding: 4px 6px;
      margin-top: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .action-buttons {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-buttons button {
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
    }

    .action-buttons button.play {
      background: #2d9cdb;
    }

    .action-buttons button.check {
      background: #2fb06b;
    }

    .action-buttons button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
    }

    #answer-display {
      margin-top: 18px;
      font-weight: 600;
      min-height: 20px;
    }

    @media (max-width: 720px) {
      .keyboard {
        justify-content: center;
      }

      .white-key {
        width: 46px;
        height: 140px;
      }

      .black-key {
        width: 28px;
        height: 100px;
      }

      .keyboard-controls button {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>
<body onload="showNoteList()">

<h1>Random Note Generator : For Ear Training</h1>

<div id="note-list"></div>

<div class="controls-row">
  <div class="reference-controls">
    <label class="reference-toggle">
      <input type="checkbox" id="reference-note-toggle" checked>
      Play reference note before pattern
    </label>
    <label for="reference-note-select">Reference note</label>
    <select id="reference-note-select"></select>
  </div>

  <label for="repeat-count">How many times should the note be played?</label>
  <input type="number" id="repeat-count" value="3" min="1">

  <label for="gap-among-notes">Gap between consecutive notes (seconds)?</label>
  <input type="number" id="gap-among-notes" value="2" min="0.1" step="0.1">

  <div class="action-buttons">
    <button class="play" onclick="playRandomNote()">Play a Random Note</button>
    <button class="check" onclick="checkAnswer()">Check Answer</button>
  </div>

  <label for="guess-select">Enter your guess (for checking)</label>
  <select id="guess-select">
    <option value="">Select a note</option>
  </select>

<p id="answer-display"></p>
</div>

<input type="hidden" id="note-answer">
<script>

var ALL_AUDIO_CLIPS = ["a3", "a4", "a5", "a-3", "a-4", "a-5",
                   "b3", "b4", "b5",
                   "c3", "c4", "c5", "c6", "c-3", "c-4", "c-5",
                   "d3", "d4", "d5", "d-3", "d-4", "d-5",
                   "e3", "e4", "e5", 
                   "f3", "f4", "f5", "f-3", "f-4", "f-5", 
                   "g3", "g4", "g5", "g-3", "g-4", "g-5" ];

const KEY_ORDER = ['c','c-','d','d-','e','f','f-','g','g-','a','a-','b'];
const WHITE_BASE_ORDER = ['c','d','e','f','g','a','b'];
const WHITE_INDEX = WHITE_BASE_ORDER.reduce((map, base, idx) => {
    map[base] = idx;
    return map;
}, {});
const WHITE_KEY_WIDTH = 56;
const WHITE_KEY_GAP = 4;
const STEP = WHITE_KEY_WIDTH + WHITE_KEY_GAP;
const BLACK_KEY_WIDTH = 36;
const PREVIOUS_WHITE = {
    c: 'b',
    d: 'c',
    e: 'd',
    f: 'e',
    g: 'f',
    a: 'g',
    b: 'a'
};
const selectedNotes = new Set(ALL_AUDIO_CLIPS);
let AUDIO_CLIPS = Array.from(ALL_AUDIO_CLIPS);

function populateReferenceSelect() {
    const select = document.getElementById("reference-note-select");
    if (!select) {
        return;
    }
    select.innerHTML = "";
    ALL_AUDIO_CLIPS.forEach(note => {
        const option = document.createElement("option");
        option.value = note;
        option.textContent = formatLabel(note);
        select.appendChild(option);
    });
    select.value = "c4";
}

function showNoteList() {
    const container = document.getElementById("note-list");
    container.innerHTML = "";

    populateReferenceSelect();

    const keyboard = document.createElement("div");
    keyboard.className = "keyboard";

    const octaves = [...new Set(ALL_AUDIO_CLIPS.map(note => {
        const match = note.match(/\d+/);
        return match ? match[0] : null;
    }))].filter(Boolean).sort((a, b) => parseInt(a, 10) - parseInt(b, 10));

    const availableNotes = new Set(ALL_AUDIO_CLIPS);
    octaves.forEach(octave => {
        const octaveBlock = document.createElement("div");
        octaveBlock.className = "octave";

        const whiteRow = document.createElement("div");
        whiteRow.className = "white-row";

        const blackRow = document.createElement("div");
        blackRow.className = "black-row";

        KEY_ORDER.forEach(base => {
            const noteId = base + octave;
            if (!availableNotes.has(noteId)) {
                return;
            }
            const isBlack = base.includes("-");
            const key = createKey(noteId, isBlack);
            if (isBlack) {
                const baseWithoutDash = base.replace("-", "");
                const preceding = PREVIOUS_WHITE[baseWithoutDash];
                const baseIndex = preceding ? WHITE_INDEX[preceding] : null;
                if (baseIndex == null) {
                    return;
                }
                const left = baseIndex * STEP + WHITE_KEY_WIDTH + (WHITE_KEY_GAP / 2) - (BLACK_KEY_WIDTH / 2);
                key.style.left = `${left}px`;
                blackRow.appendChild(key);
            } else {
                whiteRow.appendChild(key);
            }
        });

        octaveBlock.appendChild(whiteRow);
        octaveBlock.appendChild(blackRow);
        keyboard.appendChild(octaveBlock);
    });

    container.appendChild(keyboard);

    const controls = document.createElement("div");
    controls.className = "keyboard-controls";
    const deselect = document.createElement("button");
    deselect.type = "button";
    deselect.textContent = "Deselect All";
    deselect.addEventListener("click", () => updateAll(false));
    const select = document.createElement("button");
    select.type = "button";
    select.textContent = "Select All";
    select.addEventListener("click", () => updateAll(true));
    controls.appendChild(deselect);
    controls.appendChild(select);
    container.appendChild(controls);

    updateSelectedList();
}

function createKey(noteId, isBlack) {
    const key = document.createElement("button");
    key.type = "button";
    key.className = "key " + (isBlack ? "black-key" : "white-key") + (selectedNotes.has(noteId) ? " selected" : "");
    key.dataset.note = noteId;
    key.textContent = formatLabel(noteId);
    key.addEventListener("click", () => toggleKey(noteId, key));
    return key;
}

function formatLabel(note) {
    const match = note.match(/^([a-g])(-?)(\d+)$/i);
    if (!match) {
        return note.toUpperCase();
    }
    const letter = match[1].toUpperCase();
    const accidental = match[2] === "-" ? "b" : "";
    const octave = match[3];
    return letter + accidental + octave;
}

function toggleKey(note, button) {
    if (selectedNotes.has(note)) {
        selectedNotes.delete(note);
        button.classList.remove("selected");
    } else {
        selectedNotes.add(note);
        button.classList.add("selected");
    }
    updateSelectedList();
}

function updateAll(shouldSelect) {
    selectedNotes.clear();
    document.querySelectorAll("#note-list .key").forEach(key => {
        if (shouldSelect) {
            selectedNotes.add(key.dataset.note);
            key.classList.add("selected");
        } else {
            key.classList.remove("selected");
        }
    });
    updateSelectedList();
}

function updateSelectedList() {
    AUDIO_CLIPS = Array.from(selectedNotes);
    updateGuessOptions();
}
              
function updateGuessOptions() {
    const select = document.getElementById("guess-select");
    if (!select) {
        return;
    }
    select.innerHTML = "";
    if (!AUDIO_CLIPS.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No notes selected";
        option.disabled = true;
        option.selected = true;
        select.appendChild(option);
        select.disabled = true;
        return;
    }
    select.disabled = false;
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select a note";
    placeholder.disabled = true;
    placeholder.selected = true;
    select.appendChild(placeholder);
    AUDIO_CLIPS.slice().sort().forEach(note => {
        const option = document.createElement("option");
        option.value = note;
        option.textContent = formatLabel(note);
        select.appendChild(option);
    });
}

function playRandomNote() {
    const answerDisplay = document.getElementById("answer-display");
    answerDisplay.textContent = "";

    if (!AUDIO_CLIPS.length) {
        answerDisplay.textContent = "Select at least one note to play.";
        return;
    }

    const myAudio = new Audio();
    const answer = AUDIO_CLIPS[Math.floor(Math.random() * AUDIO_CLIPS.length)];
    document.getElementById("note-answer").value = answer;
    myAudio.src = "./mp3_notes/" + answer + ".mp3";

    const repeatInput = parseInt(document.getElementById("repeat-count").value, 10);
    const gapInput = parseFloat(document.getElementById("gap-among-notes").value);
    const count = Number.isFinite(repeatInput) && repeatInput > 0 ? repeatInput : 1;
    const gap = Number.isFinite(gapInput) && gapInput > 0 ? gapInput : 1;

    const referenceToggle = document.getElementById("reference-note-toggle");
    const referenceSelect = document.getElementById("reference-note-select");
    const referenceEnabled = referenceToggle ? referenceToggle.checked : false;
    const referenceNote = referenceSelect ? referenceSelect.value : "";

    if (referenceEnabled && referenceNote) {
        const referenceAudio = new Audio();
        referenceAudio.src = "./mp3_notes/" + referenceNote + ".mp3";
        referenceAudio.play();
    }

    const startDelay = referenceEnabled ? 1000 * gap : 0;
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            myAudio.play();
        }, startDelay + i * 1000 * gap);
    }
}

function checkAnswer() {
    const answer = document.getElementById("note-answer").value;
    if (!answer) {
        document.getElementById("answer-display").textContent = "Play a note first.";
        return;
    }
    const guessInput = document.getElementById("guess-input");
    const guessSelect = document.getElementById("guess-select");
    const guessValue = guessSelect ? guessSelect.value : "";
    const guessText = guessValue ? ` Your guess: ${formatLabel(guessValue)}.` : "";
    document.getElementById("answer-display").textContent = `Answer: ${formatLabel(answer)}.${guessText}`;
}

</script>

</body>
</html>
